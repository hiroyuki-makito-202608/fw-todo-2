<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="holiday-unavailable" hidden>祝日を取れませんでした</div>
    <main class="container calendar-page">
        <h1 class="page-title" th:text="${monthTitle}">年月</h1>
        <nav class="calendar-navigation" aria-label="月の移動">
            <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
            <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
        </nav>
        <table class="calendar-table" th:attr="data-from=${firstDay},data-to=${lastDay}">
            <thead>
                <tr>
                    <th scope="col" th:each="weekday : ${weekdays}" th:text="${weekday}">日</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="day : ${week}" th:attr="data-date=${day}">
                        <span th:if="${day != null}" th:text="${day.dayOfMonth}">1</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        async function loadTodosForCalendar() {
            const table = document.querySelector(".calendar-table");
            const from = table.dataset.from;
            const to = table.dataset.to;
            const params = new URLSearchParams({ from, to });
            const res = await fetch(`/api/todos?${params}`);
            const todos = await res.json();
            const holidayRes = await fetch(`/api/holidays?${params}`);
            const holidays = await holidayRes.json();

            if (holidayRes.headers.has("X-Holidays-Unavailable")) {
                document.querySelector("#holiday-unavailable").hidden = false;
            }

            document.querySelectorAll(".calendar-table td[data-date]").forEach((cell) => {
                const date = cell.dataset.date;
                const dayOfWeek = new Date(`${date}T00:00:00`).getDay();
                if (holidays[date]) {
                    cell.style.backgroundColor = "#f8d7da";
                    cell.title = holidays[date];
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = "#fce4ec";
                } else if (dayOfWeek === 6) {
                    cell.style.backgroundColor = "#e3f2fd";
                }

                todos
                    .filter((todo) => todo.dueDate === date)
                    .forEach((todo) => {
                        const name = document.createElement("div");
                        name.textContent = todo.title;
                        cell.appendChild(name);
                    });
            });
        }

        loadTodosForCalendar();
    </script>
</body>
</html>
